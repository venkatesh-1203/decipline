<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful | Download Now</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-950 px-6 text-slate-100">
    <div class="w-full max-w-lg rounded-2xl border border-emerald-400/40 bg-slate-900 p-8 text-center">
      <p class="text-5xl">✅</p>
      <h1 class="mt-4 text-3xl font-bold">Payment Successful</h1>
      <p class="mt-3 text-slate-300">Your purchase is confirmed. Click below to download your PDF instantly.</p>
      <a
        id="downloadBtn"
        href="#"
        class="mt-6 inline-block w-full rounded-xl bg-emerald-500 px-6 py-3 font-semibold text-slate-950 transition hover:bg-emerald-400"
      >
        Download PDF
      </a>
      <a href="./index.html" class="mt-3 inline-block text-sm text-cyan-300 hover:underline">Back to Home</a>
    </div>

    <script>
      const url = new URL(window.location.href);
      const downloadUrl = url.searchParams.get("download");
      const downloadBtn = document.getElementById("downloadBtn");

      if (downloadUrl) {
        downloadBtn.href = downloadUrl;
        // Auto-trigger download for better UX right after payment.
        setTimeout(() => {
          window.location.href = downloadUrl;
        }, 800);
      } else {
        downloadBtn.textContent = "Download link missing";
        downloadBtn.classList.add("pointer-events-none", "opacity-60");
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Failed | Try Again</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-950 px-6 text-slate-100">
    <div class="w-full max-w-lg rounded-2xl border border-red-400/40 bg-slate-900 p-8 text-center">
      <p class="text-5xl">⚠️</p>
      <h1 class="mt-4 text-3xl font-bold">Payment Failed</h1>
      <p id="reasonText" class="mt-3 text-slate-300">Something interrupted the payment. Please try again.</p>
      <a
        href="./index.html#pricing"
        class="mt-6 inline-block w-full rounded-xl bg-cyan-500 px-6 py-3 font-semibold text-slate-950 transition hover:bg-cyan-400"
      >
        Retry Payment
      </a>
    </div>

    <script>
      const url = new URL(window.location.href);
      const reason = url.searchParams.get("reason");
      const reasonText = document.getElementById("reasonText");

      if (reason === "verification_failed") {
        reasonText.textContent = "Payment was received but verification failed. Contact support if money was deducted.";
      }
    </script>
  </body>
</html>
